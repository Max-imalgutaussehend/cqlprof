[package]
name = "cqlprof"
description = "EXPLAIN for CQL: runs statements with tracing on Cassandra and ScyllaDB and reports tombstones, sstables, replicas, slow steps and latency percentiles"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/cqlprof"
homepage = "https://max-imalgutaussehend.github.io/cqlz/cqlprof.html"
rust-version = "1.95"
keywords = ["cassandra", "scylla", "cql", "profiler", "tracing"]
categories = ["database", "development-tools", "command-line-utilities"]
authors = ["Max-imalgutaussehend"]
readme = "README.md"

[lib]
name = "cqlprof"
path = "src/lib.rs"

[[bin]]
name = "cqlprof"
path = "src/main.rs"

[dependencies]
cqlc-core = "1.1"
scylla = "1.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
